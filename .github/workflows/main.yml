name: RealDrive V2 HIGH-END Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. FIND HIGH-END ZIP
      # ==========================================

      - name: Find HIGH-END ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -name "RealDriveV2-HIGH-END.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RealDriveV2-HIGH-END.zip not found"
            echo "Files found:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # 3. EXTRACT PROJECT
      # ==========================================

      - name: Extract HIGH-END project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Extracted project files:"
          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 4 \
            -type f \
            | head -100


      # ==========================================
      # 4. FIND GODOT PROJECT
      # ==========================================

      - name: Find Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "project.godot" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Godot project found:"
          echo "$PROJECT_DIR"
          echo "================================"


      # ==========================================
      # 5. JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 6. ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK=""

          for candidate in \
            "/usr/local/lib/android/sdk" \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_HOME" \
            "$HOME/Android/Sdk"
          do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              SDK="$candidate"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            -executable \
            2>/dev/null \
            | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 7. GODOT 4.3
      # ==========================================

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true


      # ==========================================
      # 8. GODOT ANDROID SETTINGS
      # ==========================================

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Godot Android settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres"


      # ==========================================
      # 9. DEBUG KEYSTORE
      # ==========================================

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          rm -f "$HOME/.android/debug.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created:"
          ls -lh "$HOME/.android/debug.keystore"


      # ==========================================
      # 10. VERIFY TOOLS
      # ==========================================

      - name: Verify tools
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo "===== GODOT ====="
          godot --version

          echo "===== ADB ====="
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo "===== SDKMANAGER ====="
          "$SDKMANAGER" --version

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "===== PLATFORM ====="
          ls -la "$ANDROID_SDK_ROOT/platforms/android-35"


      # ==========================================
      # 11. CREATE ANDROID EXPORT PRESET
      # ==========================================

      - name: Create Android export preset
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/export_presets.cfg" <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=false
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/custom_theme_attributes={}
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""

          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.realdrive.v2.highend"
          package/name="RealDrive V2 HIGH-END"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=true

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          launcher_icons/adaptive_monochrome_432x432=""

          graphics/opengl_debug=false

          gesture/swipe_to_dismiss=false

          xr_features/xr_mode=0

          screen/background_color=Color(0, 0, 0, 1)
          screen/edge_to_edge=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          shader_baker/enabled=false

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""

          permissions/custom_permissions=PackedStringArray()

          permissions/access_network_state=false
          permissions/access_wifi_state=false
          permissions/internet=false
          permissions/vibrate=false
          permissions/wake_lock=false
          permissions/access_coarse_location=false
          permissions/access_fine_location=false
          permissions/camera=false
          permissions/record_audio=false
          permissions/post_notifications=false
          EOF

          echo "================================"
          echo "ANDROID PRESET CREATED"
          echo "================================"

          cat "$PROJECT_DIR/export_presets.cfg"


      # ==========================================
      # 12. ENABLE ETC2 / ASTC
      # ==========================================

      - name: Enable Android ETC2 ASTC
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "ENABLING ETC2 / ASTC"
          echo "================================"

          python3 - "$PROJECT_DIR/project.godot" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          setting = "textures/vram_compression/import_etc2_astc=true"

          if setting not in data:
              data += "\n\n[rendering]\n\n" + setting + "\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          print("ETC2/ASTC setting enabled.")
          PY

          echo "===== RENDERING SETTINGS ====="

          grep -A10 "\[rendering\]" \
            "$PROJECT_DIR/project.godot" || true


      # ==========================================
      # 13. IMPORT GODOT PROJECT
      # ==========================================

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "IMPORTING GODOT PROJECT"
          echo "================================"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

          echo "Godot project imported successfully."


      # ==========================================
      # 14. CHECK PROJECT
      # ==========================================

      - name: Check Android preset
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "PROJECT FILE"
          echo "================================"

          cat "$PROJECT_DIR/project.godot"

          echo "================================"
          echo "EXPORT PRESET"
          echo "================================"

          cat "$PROJECT_DIR/export_presets.cfg"

          echo "================================"
          echo "KEYSTORE"
          echo "================================"

          ls -lh "$HOME/.android/debug.keystore"

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo "SDK: $ANDROID_SDK_ROOT"

          echo "================================"
          echo "GODOT VERSION"
          echo "================================"

          godot --version


      # ==========================================
      # 15. BUILD APK
      # ==========================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/build"

          echo ""
          echo "================================"
          echo "BUILDING REALDRIVE V2"
          echo "================================"
          echo ""

          godot \
            --headless \
            --verbose \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$PROJECT_DIR/build/RealDriveV2-HIGH-END.apk"


      # ==========================================
      # 16. VERIFY APK
      # ==========================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/build/RealDriveV2-HIGH-END.apk"

          echo "================================"
          echo "VERIFYING APK"
          echo "================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."

            echo ""
            echo "BUILD DIRECTORY:"
            find "$PROJECT_DIR/build" \
              -maxdepth 5 \
              -type f \
              -ls || true

            exit 1
          fi

          echo ""
          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================"
          echo ""

          ls -lh "$APK"

          file "$APK"


      # ==========================================
      # 17. UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealDriveV2-HIGH-END
          path: ${{ env.PROJECT_DIR }}/build/RealDriveV2-HIGH-END.apk
          if-no-files-found: error
