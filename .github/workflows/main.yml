name: RealDrive V2 HIGH-END Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find HIGH-END ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name "RealDriveV2-HIGH-END.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RealDriveV2-HIGH-END.zip not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found: $ZIP"

      - name: Extract HIGH-END project
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

      - name: Find Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "project.godot" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "Searching for Android SDK..."

          SDK=""

          for candidate in \
            "/usr/local/lib/android/sdk" \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_HOME" \
            "$HOME/Android/Sdk"
          do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              SDK="$candidate"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "Android SDK found at:"
          echo "$SDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Checking sdkmanager..."

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -executable \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Godot Android settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify tools
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo "Godot:"
          godot --version

          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "ADB:"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo "SDK Manager:"
          "$SDKMANAGER" --version

      - name: Create Android export preset
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/export_presets.cfg" <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patch_list=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          package/unique_name="com.realdrive.v2.highend"
          package/name="RealDrive V2 HIGH-END"
          package/short_name="RealDrive V2"
          package/version_code=1
          package/version_name="1.0"

          package/signed=true

          export_format/convert_text_resources=true
          export_format/convert_binary_resources=true

          screen/handheld/orientation=1
          screen/immersive_mode=true

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true

          android_sdk_path="$ANDROID_SDK_ROOT"

          export/android/debug_keystore="$HOME/.android/debug.keystore"
          export/android/debug_keystore_user="androiddebugkey"
          export/android/debug_keystore_pass="android"

          gradle_build/use_gradle_build=false
          EOF

          echo "Created export preset:"
          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/build"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$PROJECT_DIR/build/RealDriveV2-HIGH-END.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/build/RealDriveV2-HIGH-END.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            find "$PROJECT_DIR/build" -type f -maxdepth 3 || true
            exit 1
          fi

          ls -lh "$APK"

          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealDriveV2-HIGH-END
          path: ${{ env.PROJECT_DIR }}/build/RealDriveV2-HIGH-END.apk
          if-no-files-found: error
