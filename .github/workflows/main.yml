name: Build RealDrive V2 HIGH-END APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find HIGH-END ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "RealDriveV2-HIGH-END.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RealDriveV2-HIGH-END.zip was not found."
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Extract HIGH-END project
        shell: bash
        run: |
          set -e

          rm -rf game
          mkdir -p game

          unzip -o "$ZIP_FILE" -d game

          echo "Extracted project:"
          find game -name "project.godot" -o -name "export_presets.cfg"

      - name: Find Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find game -type f -name "project.godot" | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project:"
          echo "$PROJECT_DIR"

      - name: Fix Android export preset
        shell: bash
        run: |
          set -e

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [ ! -f "$PRESET" ]; then
            echo "ERROR: export_presets.cfg not found."
            exit 1
          fi

          echo "Before fix:"
          cat "$PRESET"

          python3 - "$PRESET" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if 'include_filter=' not in text:
              text = text.replace(
                  'export_filter="all_resources"',
                  'export_filter="all_resources"\ninclude_filter=""\nexclude_filter=""'
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo "After fix:"
          cat "$PRESET"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: |
          godot --version

      - name: Import Godot project
        run: |
          godot \
            --headless \
            --editor \
            --quit \
            --path "$PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/build"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/RealDriveV2-HIGH-END.apk"

      - name: Check APK
        run: |
          echo "Generated APK:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealDriveV2-HIGH-END-debug
          path: |
            ${{ env.PROJECT_DIR }}/build/*.apk
          if-no-files-found: error
