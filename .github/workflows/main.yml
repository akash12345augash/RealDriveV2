name: Build Real Drive V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Real Drive V2 APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract game project
        run: |
          mkdir -p game
          unzip -o RealDriveV2-FIXED.zip -d game

          echo "Extracted files:"
          find game -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "Searching for settings.gradle..."
          find game -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build Debug APK
        run: |
          PROJECT=$(dirname "$(find game -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -1)")
          echo "Project directory: $PROJECT"

          cd "$PROJECT"

          echo "Project files:"
          ls -la

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find game -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealDriveV2-debug-apk
          path: game/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
