name: Build RealDrive V2 HIGH-END APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find HIGH-END ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "RealDriveV2-HIGH-END.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RealDriveV2-HIGH-END.zip not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
          echo "Found: $ZIP"

      - name: Extract HIGH-END project
        shell: bash
        run: |
          set -e

          rm -rf game
          mkdir -p game

          unzip -o "$ZIP_FILE" -d game

      - name: Find Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find game -type f -name "project.godot" | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "===== GODOT ANDROID SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Verify tools
        shell: bash
        run: |
          set -e

          godot --version
          java -version
          adb version
          sdkmanager --version

      - name: Create Android export preset
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=false
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.realdrive.v2.highend"
          package/name="RealDrive V2 HIGH-END"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          launcher_icons/adaptive_monochrome_432x432=""

          graphics/opengl_debug=false
          shader_baker/enabled=false

          xr_features/xr_mode=0

          gesture/swipe_to_dismiss=false

          screen/immersive_mode=true
          screen/edge_to_edge=false
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""

          permissions/custom_permissions=PackedStringArray()
          permissions/internet=true
          permissions/vibrate=false
          permissions/wake_lock=false
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --editor \
            --quit \
            --path "$PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/build"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/RealDriveV2-HIGH-END.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/build" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealDriveV2-HIGH-END
          path: |
            ${{ env.PROJECT_DIR }}/build/*.apk
          if-no-files-found: error
