name: Build RealDrive V2 HIGH-END APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find HIGH-END ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "RealDriveV2-HIGH-END.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RealDriveV2-HIGH-END.zip was not found."
            echo "ZIP files currently in repository:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Extract HIGH-END project
        shell: bash
        run: |
          set -e

          rm -rf game
          mkdir -p game

          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d game

          echo ""
          echo "Extracted files:"
          find game -maxdepth 4 -type f | head -100

      - name: Find Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find game -type f -name "project.godot" | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Godot project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: |
          godot --version

      - name: Import Godot project
        run: |
          godot \
            --headless \
            --editor \
            --quit \
            --path "$PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/build"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/RealDriveV2-HIGH-END.apk"

      - name: Check APK
        run: |
          echo "Generated APK:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealDriveV2-HIGH-END-debug
          path: |
            ${{ env.PROJECT_DIR }}/build/*.apk
          if-no-files-found: error
